name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Add base path for GitHub Pages
        run: |
          cd out
          # Rewrite all href and src attributes to include /polygon-shop prefix
          find . -name '*.html' -exec sed -i 's|href="/|href="/polygon-shop/|g' {} +
          find . -name '*.html' -exec sed -i 's|src="/|src="/polygon-shop/|g' {} +
          # Rewrite CSS url() references
          find . -name '*.css' -exec sed -i 's|url("/|url("/polygon-shop/|g' {} +
          # Move everything into a polygon-shop subdirectory
          mkdir -p polygon-shop
          cp -r . polygon-shop/ 2>/dev/null || true
          # Remove duplicates that got copied inside polygon-shop/polygon-shop
          rm -rf polygon-shop/polygon-shop
          # Create root index.html that redirects to the subdirectory
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head><meta http-equiv="refresh" content="0; url=/polygon-shop/"></head>
          </html>
          EOF
          # Create 404.html for SPA-like routing
          cp index.html 404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4